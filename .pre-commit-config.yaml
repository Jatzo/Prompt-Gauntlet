# Local hooks use the tools already on PATH, so nothing is downloaded at commit time.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --config .gitleaks.toml
        language: system
        pass_filenames: false
      - id: tracked-files-guard
        name: private and runtime files stay out of git
        entry: python3 scripts/check_tracked_files.py
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        # pre-commit names each file, and ruff skips its own exclude list for named files without this.
        entry: ruff check --force-exclude
        language: system
        types: [python]
