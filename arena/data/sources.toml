max_chars = 4000
transforms = ["attacker_address"]
files = [
  { path = "baseline_attacks.py", url = "https://raw.githubusercontent.com/ethz-spylab/agentdojo/089ed468cf3ed0322acc66b0211f26d9d90dbf60/src/agentdojo/attacks/baseline_attacks.py" },
