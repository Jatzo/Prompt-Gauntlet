[agentdojo.options]
# AgentDojo's defaults for the names its templates fill in.
user = "Emma Johnson"
model = "the AI language model"
attacks = ["direct", "ignore_previous", "system_message", "injecagent", "important_instructions"]

[llmail]
use = "dataset"
label = "attack"
channel = "email"
impact_class = "unauthorised_action"
origin = "real"
generator_family = "llmail-human"
non_claude = true
private_only = false
licence = "MIT, with notice"
# Raised from 3,000 on 2026-10-27: the first real build left train with no attacks. Many rows are
# close variants of one attack, so the stricter near-duplicate cut for this family removes many.
cap = 6000
max_chars = 6000
transforms = ["attacker_address"]
files = [
  { path = "labelled_unique_submissions_phase2.json", url = "https://huggingface.co/datasets/microsoft/llmail-inject-challenge/resolve/1063bdf01ec8762b812d5e06ee768a06faa5a6f7/data/labelled_unique_submissions_phase2.json" },
]

