# The approved sources for the real data build: the operator's marks in the private dataset
# shortlist, 2026-10-26. Tensor Trust is out and has no entry.
#
# `python -m arena.cli data fetch` downloads each file at its pinned revision into
# private/data/raw/<source>/ and records its SHA-256 in private/data/raw/manifest.json. A file whose
# hash changes stops the build. Nothing fetched is ever committed.
#
# use:          "dataset" enters the build; "labelling_check" is kept aside to check the labellers.
# label:        "attack", "benign", or "mixed" (the row says which).
# origin:       Sample.source, "real" for text people wrote, "generated" otherwise.
# non_claude:   true only when no Claude model wrote or edited the text; unknown counts as false.
# private_only: never in a committed example, a public sample or a report excerpt.
# cap:          at most this many samples, a seeded sample when the source has more.
# transforms:   "attacker_address" swaps every email address and URL host in attack text for the
#               {ATTACKER} placeholder, so no attack names a real endpoint; "scrub_contacts"
#               replaces addresses and phone numbers in benign text.

seed = 20261026

[deepset]
use = "labelling_check"
label = "mixed"
channel = "user"
impact_class = "goal_hijacking"
origin = "real"
generator_family = "deepset"
non_claude = false
private_only = false
licence = "Apache-2.0, attribution"
cap = 1000
max_chars = 4000
transforms = ["attacker_address"]
files = [
  { path = "train.parquet", url = "https://huggingface.co/datasets/deepset/prompt-injections/resolve/4f61ecb038e9c3fb77e21034b22511b523772cdd/data/train-00000-of-00001-9564e8b05b4757ab.parquet" },
  { path = "test.parquet", url = "https://huggingface.co/datasets/deepset/prompt-injections/resolve/4f61ecb038e9c3fb77e21034b22511b523772cdd/data/test-00000-of-00001-701d16158af87368.parquet" },
]

