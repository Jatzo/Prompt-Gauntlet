name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev,data]"

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm -f "$archive" "gitleaks_${GITLEAKS_VERSION}_checksums.txt"

      - name: Lint, guard, tests and secret scan
        run: make ci PYTHON=python
