[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-gauntlet"
version = "0.1.0"
description = "Self-improving prompt-injection defence, measured end to end against an adaptive attacker."
readme = "PLAN.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    # The bootstrap runs thousands of replicates over thousands of items.
    "numpy>=2",
    # Regex rules need a per-match timeout, which the standard `re` module cannot give.
    "regex>=2024.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
# The open-weights logit classifier baseline. Optional so CI never downloads a model.
openweights = [
    "torch>=2.4",
    "transformers>=4.44",
]
# The live backend: the Claude Agent SDK on the operator's plan. Pinned, since it is alpha.
live = [
    "claude-agent-sdk==0.2.174",
]

[tool.setuptools.packages.find]
include = ["arena*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101: pytest uses bare assert. S603/S607: subprocess calls run our own entry points with fixed arguments.
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# A path and a 64-character hash on one line cannot be wrapped.
"tests/test_integrity.py" = ["E501"]

[tool.ruff.format]
# The Judge is hash-pinned; a formatter pass must never be able to change it.
exclude = ["arena/judge/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
