title = "prompt-gauntlet"

[extend]
useDefault = true

# Local tool and runtime folders are never committed and hold third-party code, so they are not ours to scan.
[allowlist]
description = "Local environments and caches"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)\.git/''',
    '''(^|/)\.pytest_cache/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)__pycache__/''',
    # Fetched third-party datasets: attack submissions and public code carry sample keys. The
    # folder is gitignored and the tracked-files guard refuses any private/ path.
    '''(^|/)private/data/raw/''',
]
