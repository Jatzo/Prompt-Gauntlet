title = "prompt-gauntlet"

[extend]
useDefault = true

# Local tool and runtime folders are never committed and hold third-party code, so they are not ours to scan.
[allowlist]
description = "Local environments and caches"
paths = [
    '''(^|/)\.venv/''',
    '''(^|/)\.git/''',
    '''(^|/)\.pytest_cache/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)__pycache__/''',
    # Private data and run output: fetched datasets carry sample keys, and novelty archives hold
    # hashes that read as keys. Both folders are gitignored, the tracked-files guard refuses any
    # path in them, and the commit-history scan still covers everything that reaches git.
    '''^private/''',
    '''^runs/''',
]
